backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Travel Articles"
    label_singular: "Travel Article"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Income Shuvo" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false }
      - { label: "Category", name: "category", widget: "select", options: [
          "Bangladesh",
          "Mountains",
          "Beaches",
          "Adventure",
          "Culture & Food",
          "Budget Travel",
          "International",
          "Travel Tips"
        ]}
      - { label: "Destination", name: "destination", widget: "string" }
      - { label: "Country", name: "country", widget: "string" }
      - { label: "Reading Time", name: "readingTime", widget: "string", default: "6 min read" }
      - { label: "Estimated Cost", name: "estimatedCost", widget: "string" }
      - { label: "Excerpt / Deck", name: "excerpt", widget: "text" }
      - { label: "SEO Meta Title", name: "metaTitle", widget: "string", required: false }
      - { label: "SEO Meta Description", name: "metaDescription", widget: "text", required: false }
      - { label: "Keywords", name: "keywords", widget: "list", required: false }
      - { label: "Body Content (Markdown)", name: "body", widget: "markdown" }
